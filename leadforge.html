<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="LeadForge"><meta name="theme-color" content="#0e1014"><meta name="robots" content="noindex,nofollow,noarchive"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<title>LeadForge</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f6f8;--cd:#fff;--tx:#14171c;--mu:#667085;--bd:#e3e6eb;--ac:#2557d6;--ax:#fff;--ok:#16794c;--wr:#b54708;--er:#c0362c}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1014;--cd:#171a20;--tx:#eceef2;--mu:#9aa3b2;--bd:#2a2f38;--ac:#7aa0ff;--ax:#0b1020;--ok:#4cc38a;--wr:#f0a35b;--er:#ff8a80}}
:root[data-theme="dark"]{--bg:#0e1014;--cd:#171a20;--tx:#eceef2;--mu:#9aa3b2;--bd:#2a2f38;--ac:#7aa0ff;--ax:#0b1020;--ok:#4cc38a;--wr:#f0a35b;--er:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:88px}
main{max-width:760px;margin:0 auto;padding:14px}
h2{font-size:22px;margin:4px 0 12px}h3{margin:8px 0}
.mu{color:var(--mu);font-size:14px}.no{color:var(--mu)}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:0 0 10px;overflow-wrap:anywhere}
.cd[data-id]{cursor:pointer}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.st div{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:8px;text-align:center}
.st b{display:block;font-size:20px}.st span{font-size:12px;color:var(--mu)}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--cd)}
input[type=checkbox]{width:22px;min-height:22px;margin-right:8px}
label{display:block;font-size:13px;color:var(--mu);margin:0 0 10px}
label input,label select{margin-top:4px;color:var(--tx);font-size:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.sg{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}button:disabled{opacity:.4;cursor:not-allowed}.g2 button{flex:1 1 calc(50% - 4px)}
button{min-height:46px;padding:10px 16px;border-radius:12px;border:1px solid var(--bd);background:var(--cd);cursor:pointer}
button.p{background:var(--ac);color:var(--ax);border-color:var(--ac);font-weight:600}
button.on{border-color:var(--ac);color:var(--ac);font-weight:600}
button.w{color:var(--er);border-color:var(--er)}
.ch{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:13px}
.ch i{font-style:normal;background:var(--bg);border-radius:8px;padding:2px 8px}
.ch .ok{color:var(--ok)}.ch .wr{color:var(--wr)}
details{margin:6px 0 6px 0}summary{padding:10px 4px;font-weight:600;cursor:pointer;min-height:44px}
details details{margin-left:12px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--cd);border-top:1px solid var(--bd)}
nav button{flex:1;border:0;background:none;font-size:14px}
nav button.on{color:var(--ac);font-weight:700}
#md{position:fixed;inset:0;background:rgba(0,0,0,.45);overflow:auto;z-index:5}
.sh{background:var(--bg);margin:calc(env(safe-area-inset-top,0px) + 16px) auto 24px;max-width:640px;border-radius:16px;padding:14px;width:calc(100% - 20px)}
#ts{position:fixed;left:12px;right:12px;bottom:92px;background:var(--tx);color:var(--bg);padding:12px 14px;border-radius:12px;display:none;z-index:9}
.ban{background:var(--cd);border:1px solid var(--wr);color:var(--wr);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}
details.hb{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:0 12px;margin:0 0 10px}details.hb summary{padding:12px 0}label.ck{display:flex;align-items:center;min-height:44px;margin:0;color:var(--tx);font-size:16px}details.hb button[data-a=clearh]{width:100%;margin:8px 0 12px}a{color:var(--ac)}a.lb{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:10px 16px;border:1px solid var(--bd);border-radius:12px;background:var(--cd);color:var(--tx);text-decoration:none}textarea{min-height:90px}
</style></head><body>
<main><div id="app"></div></main>
<div id="md" hidden></div><div id="ts"></div>
<nav><button data-t="leads">Leads</button><button data-t="cli">Clients</button><button data-t="src">Find</button><button data-t="imp">Import</button><button data-t="exp">Export</button></nav>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST="AL Alabama|AK Alaska|AZ Arizona|AR Arkansas|CA California|CO Colorado|CT Connecticut|DE Delaware|DC District of Columbia|FL Florida|GA Georgia|HI Hawaii|ID Idaho|IL Illinois|IN Indiana|IA Iowa|KS Kansas|KY Kentucky|LA Louisiana|ME Maine|MD Maryland|MA Massachusetts|MI Michigan|MN Minnesota|MS Mississippi|MO Missouri|MT Montana|NE Nebraska|NV Nevada|NH New Hampshire|NJ New Jersey|NM New Mexico|NY New York|NC North Carolina|ND North Dakota|OH Ohio|OK Oklahoma|OR Oregon|PA Pennsylvania|RI Rhode Island|SC South Carolina|SD South Dakota|TN Tennessee|TX Texas|UT Utah|VT Vermont|VA Virginia|WA Washington|WV West Virginia|WI Wisconsin|WY Wyoming".split('|').map(s=>[s.slice(0,2),s.slice(3)]);
const IND="Home services|Roofing|Plumbing|HVAC|Electrical contractors|Landscaping|Cleaning services|Pest control|General contractors|Auto repair|Auto dealers|Car wash|Restaurants|Cafes and bakeries|Hotels and lodging|Retail|Dentists|Medical clinics|Chiropractors|Gyms and fitness|Salons and barbers|Spas and wellness|Pet services|Veterinarians|Real estate|Property management|Insurance agencies|Accountants and tax|Attorneys|Financial services|Manufacturing|Wholesale and distribution|Trucking and logistics|Agriculture|Schools and tutoring|Software and IT services|Marketing agencies|Entertainment and recreation|Nonprofits and churches".split('|');
const STAT=['New','Reviewed','Contacted','Qualified','Do not contact'];
const COLS=['name','phone','email','emailStatus','emailPage','website','address','city','county','state','zip','industry','niche','source','verified','discovered','client','campaign','batch','status','notes'];
const FIELDS=COLS;
const ALIAS={name:['name','business name','business','company','title'],phone:['phone','telephone','phone number','tel'],website:['website','url','site','web'],email:['email','e-mail','email address'],address:['address','street','street address','address line 1','address1'],city:['city','locality','town'],state:['state','region','st'],zip:['zip','zip code','postal code','postcode','postal'],county:['county'],niche:['category','categories','primary category','type','niche']};
let db=null,mem=[],L=[],tab='leads',q='',f={ind:'',st:'',cl:'',stt:'',cp:''},view='list',pend=null,cur=null,delArm=false,dl=null,out='';
let ctx={industry:'',niche:'',state:'',county:'',city:'',client:'',campaign:'',source:'Overture Maps (file import)'};
let xo={nodnc:true,phone:false,email:false,attr:true,summ:true};
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clean=v=>String(v==null?'':v).replace(/[\u0000-\u001f\u007f]+/g,' ').trim().slice(0,400);
const fmtPhone=v=>{const d=String(v||'').replace(/\D/g,'');const t=d.length==11&&d[0]=='1'?d.slice(1):d;return t.length==10?`(${t.slice(0,3)}) ${t.slice(3,6)}-${t.slice(6)}`:clean(v)};
const FREE=/@(gmail|yahoo|hotmail|outlook|aol|icloud|live|msn)\./i;
function emSt(l){if(!l.email)return 'Unavailable';if(FREE.test(l.email))return 'Source-listed, free-mail (may be personal)';const d=dom(l.website),ed=(l.email.split('@')[1]||'').toLowerCase();if(d&&ed&&(ed.endsWith(d)||d.endsWith(ed)))return 'Source-listed, matches website';if(d)return 'Source-listed, domain differs from website';return 'Source-listed, not verified'}
const stCode=v=>{v=clean(v);const u=v.toUpperCase();if(ST.some(s=>s[0]==u))return u;const m=ST.find(s=>s[1].toLowerCase()==v.toLowerCase());return m?m[0]:v};
function toast(m){const t=$('#ts');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3500)}

/* storage: IndexedDB with in-memory fallback */
function openDB(){return new Promise(r=>{try{const q=indexedDB.open('leadforge',1);q.onupgradeneeded=()=>q.result.createObjectStore('leads',{keyPath:'id'});q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})}
function all(){return new Promise(r=>{if(!db)return r(mem.slice());try{const q=db.transaction('leads').objectStore('leads').getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r(mem.slice())}catch(e){r(mem.slice())}})}
function put(a){return new Promise((res,rej)=>{if(!db){a.forEach(x=>{const i=mem.findIndex(m=>m.id==x.id);i<0?mem.push(x):mem[i]=x});return res()}const t=db.transaction('leads','readwrite');a.forEach(x=>t.objectStore('leads').put(x));t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
function rm(id){return new Promise((res,rej)=>{if(!db){mem=mem.filter(m=>m.id!=id);return res()}const t=db.transaction('leads','readwrite');t.objectStore('leads').delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}

/* identity + dedupe: exact normalized matches only; similar names are never merged */
const dig=s=>(s||'').replace(/\D/g,'').replace(/^1(?=\d{10}$)/,'');
const nn=s=>(s||'').toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').replace(/\b(llc|inc|co|corp|ltd)\b/g,'').replace(/\s+/g,' ').trim();
const dom=u=>{try{const h=new URL(/^https?:/i.test(u)?u:'https://'+u).hostname.replace(/^www\./,'').toLowerCase();return /(^|\.)(facebook|instagram|yelp|linkedin|google|youtube|youtu|linktr|weblinkconnect|homeadvisor|angi|angieslist|houzz|thumbtack|yellowpages|yp|bbb|mapquest|manta|porch|nextdoor|twitter|x|tiktok|pinterest)\./.test(h)?'':h}catch(e){return ''}};
function keys(l){const k=[];if(dig(l.phone).length==10)k.push('p:'+dig(l.phone));if(nn(l.name)&&nn(l.address))k.push('a:'+nn(l.name)+'|'+nn(l.address));if(dom(l.website)&&nn(l.name)&&!nn(l.address))k.push('d:'+dom(l.website)+'|'+nn(l.name));if(!k.length&&nn(l.name))k.push('n:'+nn(l.name)+'|'+nn(l.city)+'|'+(l.state||''));if(l.id)k.push('i:'+l.id);return k}
const sc=l=>Math.round(100*[l.phone,l.address,dom(l.website),l.email].filter(Boolean).length/4);

/* Hide panel: each checkbox hides leads matching that condition */
let hd={},hOpen=false;
const HIDE=[['Missing',[['nophone','No phone',l=>!l.phone],['noemail','No email',l=>!l.email],['nosite','No website',l=>!l.website],['noaddr','No address',l=>!l.address]]],['Quality flags',[['link','Link page only (not a real website)',l=>l.website&&!dom(l.website)],['free','Free-mail email (may be personal)',l=>FREE.test(l.email||'')],['differs','Email domain differs from website',l=>/differs/.test(l.emailStatus||'')],['low','Under 50% complete',l=>sc(l)<50]]],['Has',[['hasite','Has a real website',l=>!!dom(l.website)]]],['Status',STAT.map(s=>['st_'+s,s,l=>l.status==s])],['Suppression',[['supp','On suppression list',l=>!!supHit(l)]]]];
const HO=HIDE.flatMap(g=>g[1]);
let hcat=new Set(),hwords='';
const wlist=()=>hwords.toLowerCase().split(/[,\n]/).map(x=>x.trim()).filter(x=>x.length>1);
const hword=l=>{const w=wlist();if(!w.length)return false;const t=(l.name+' '+(l.niche||'')).toLowerCase();return w.some(x=>t.includes(x))};
const hidden=l=>HO.some(o=>hd[o[0]]&&o[2](l))||hcat.has(l.niche||'—')||hword(l);
function saveH2(){try{localStorage.setItem('lf_hide2',JSON.stringify({c:[...hcat],w:hwords}))}catch(e){}}
function loadH2(){try{const j=JSON.parse(localStorage.getItem('lf_hide2')||'{}');if(Array.isArray(j.c))j.c.slice(0,500).forEach(x=>hcat.add(clean(x)));if(typeof j.w=='string')hwords=j.w.slice(0,300)}catch(e){}}
loadH2();
const nHide=()=>HO.filter(o=>hd[o[0]]).length+hcat.size+(wlist().length?1:0);
const hTxt=()=>nHide()?'('+nHide()+' on)':'';
function saveHide(){try{localStorage.setItem('lf_hide',JSON.stringify(Object.fromEntries(HO.filter(o=>hd[o[0]]).map(o=>[o[0],true]))))}catch(e){}}
function loadHide(){try{const j=JSON.parse(localStorage.getItem('lf_hide')||'{}');HO.forEach(o=>{if(j&&j[o[0]]===true)hd[o[0]]=true})}catch(e){}}
loadHide();
const vHide=()=>`<details class="hb" id="hd"${hOpen?' open':''}><summary>Hide <span id="hn" class="mu">${hTxt()}</span></summary>${HIDE.map(g=>`<div class="mu" style="margin:6px 0 0">${g[0]}</div>${g[1].map(o=>`<label class="ck"><input type="checkbox" data-h="${esc(o[0])}"${hd[o[0]]?' checked':''}>${esc(o[1])}</label>`).join('')}`).join('')}${vHcat()}<button data-a="clearh">Clear all</button></details>`;
/* CSV */
function csv(t){const r=[];let row=[],c='',qt=false;t=t.replace(/^\ufeff/,'');for(let i=0;i<t.length;i++){const ch=t[i];if(qt){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else qt=false}else c+=ch}else if(ch=='"')qt=true;else if(ch==','){row.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;row.push(c);r.push(row);row=[];c=''}else c+=ch}if(c||row.length){row.push(c);r.push(row)}return r.filter(x=>x.some(y=>y.trim()))}
const cell=(v,col)=>{v=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(v)&&!(col=='phone'&&/^\+?[\d\s().-]+$/.test(v)))v="'"+v;return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};

/* import: parse -> preview -> commit (atomic) */
function mk(o){const l={};FIELDS.forEach(k=>l[k]=clean(o[k]));if(o.notes)l.notes=String(o.notes).slice(0,2000);l.state=stCode(l.state||ctx.state);l.phone=fmtPhone(l.phone);l.niche=l.niche.replace(/_/g,' ');['industry','niche','county','city','client','campaign','source'].forEach(k=>{if(!l[k])l[k]=clean(ctx[k])});if(!l.batch)l.batch=(ctx.campaign||'Import')+' · '+today();if(!l.discovered)l.discovered=today();if(!l.status)l.status='New';if(!l.verified)l.verified='Unverified';if(!l.emailStatus)l.emailStatus=emSt(l);l.id=clean(o.id)||uid();l.history=Array.isArray(o.history)?o.history.slice(0,50):[{batch:l.batch,campaign:l.campaign,client:l.client,date:l.discovered}];return l}
async function pick(file){if(!file)return;let t;try{t=await file.text()}catch(e){return toast('Could not read that file.')}ingest(t,file.name)}
function ingest(t,name){try{let rows,psup=[];const s=t.trim();if(s[0]=='{'||s[0]=='['){const j=JSON.parse(s);rows=Array.isArray(j)?j:j.leads;psup=Array.isArray(j.suppression)?j.suppression:[];if(!Array.isArray(rows))throw 0}else{const c0=csv(t),hi=c0.findIndex(r=>r.some(x=>ALIAS.name.includes(x.trim().toLowerCase())));if(hi<0)throw 0;const c=c0.slice(hi),h=c[0].map(x=>x.trim().toLowerCase()),ix={};Object.keys(ALIAS).forEach(k=>{ix[k]=h.findIndex(x=>ALIAS[k].includes(x))});if(ix.name<0)throw 0;rows=c.slice(1).map(r=>{const o={};Object.keys(ix).forEach(k=>{if(ix[k]>=0)o[k]=r[ix[k]]});return o})}
const cands=rows.filter(x=>x&&typeof x=='object').slice(0,20000).map(mk);const idx=new Map();L.forEach(l=>keys(l).forEach(k=>idx.set(k,l)));const seen=new Set(),nw=[],dup=[],bad=[],blk=[],flt=[];cands.forEach(c=>{if(!c.name){bad.push(c);return}if(supHit(c)){blk.push(c);return}if(ctx.nosite&&dom(c.website)){flt.push(c);return}const ks=keys(c),hit=ks.map(k=>idx.get(k)).find(Boolean);if(hit||ks.some(k=>seen.has(k)))dup.push({c,hit});else{nw.push(c);ks.forEach(k=>seen.add(k))}});pend={nw,dup,bad,blk,flt,sup:psup,name};render()}catch(e){pend=null;toast('Could not read that file. Nothing was changed.')}}
async function commit(){if(!pend)return;(pend.sup||[]).forEach(s=>{if(s&&['p','e','d'].includes(s.t)&&typeof s.v=='string'&&s.v&&!SUP.some(x=>x.t==s.t&&x.v==s.v.toLowerCase()))SUP.push({t:s.t,v:clean(s.v).toLowerCase(),added:today()})});saveSup();const tag=$('#tg')&&$('#tg').checked,upd=[];if(tag)pend.dup.forEach(d=>{if(d.hit){d.hit.history=(d.hit.history||[]).concat([{batch:d.c.batch,campaign:d.c.campaign,client:d.c.client,date:today()}]);upd.push(d.hit)}});try{await put(pend.nw.concat(upd));toast(pend.nw.length+' leads added');pend=null;L=await all();tab='leads';render()}catch(e){toast('Save failed; nothing was changed.')}}

/* views */
const uniq=k=>[...new Set(L.map(l=>l[k]).filter(Boolean))].sort();
const sel=(k,lab,o)=>`<select data-f="${k}" aria-label="${lab}"><option value="">${lab}: all</option>${o.map(v=>`<option${f[k]==v?' selected':''}>${esc(v)}</option>`).join('')}</select>`;
const cnt=fn=>L.filter(fn).length;
const days=d=>(Date.now()-new Date(d||0).getTime())/864e5;
function filt(nh){const s=q.toLowerCase();return L.filter(l=>(!f.ind||l.industry==f.ind)&&(!f.st||l.state==f.st)&&(!f.cl||l.client==f.cl)&&(!f.stt||l.status==f.stt)&&(!f.cp||l.campaign==f.cp)&&(!s||[l.name,l.city,l.niche,l.phone,l.email,l.website,l.notes].join(' ').toLowerCase().includes(s))&&(nh||!hidden(l)))}
function card(l){return `<div class="cd" data-id="${esc(l.id)}"><b>${esc(l.name)}</b><div class="mu">${esc([l.niche||l.industry,l.city,l.state].filter(Boolean).join(' · '))}</div><div class="ch">${l.phone?`<i>${esc(l.phone)}</i>`:'<i class="no">No phone</i>'}${l.email?`<i>${esc(l.email)}</i>`:'<i class="no">No email</i>'}${l.website?(dom(l.website)?'<i>Website</i>':'<i class="wr">Link page only</i>'):'<i class="no">No website</i>'}<i class="${sc(l)>=75?'ok':'wr'}">${sc(l)}% complete</i>${l.status=='Do not contact'?'<i class="wr">Do not contact</i>':''}${supHit(l)?'<i class="wr">Suppressed</i>':''}</div></div>`}
function tree(a,ks){if(!ks.length)return a.map(card).join('');const k=ks[0],g={};a.forEach(l=>{const n=l[k]||'—';(g[n]=g[n]||[]).push(l)});return Object.keys(g).sort().map(n=>`<details><summary>${esc(n)} <span class="mu">(${g[n].length})</span></summary>${tree(g[n],ks.slice(1))}</details>`).join('')}
function drawList(){const a=filt(),e=$('#lst');if(!e)return;e.innerHTML=(nHide()&&L.length?'<div class="mu" style="margin-bottom:8px">'+(filt(1).length-a.length)+' hidden by Hide settings</div>':'')+(!L.length?'<div class="cd"><b>No leads yet</b><div class="mu">Open the Import tab and load a file. Nothing here is sample data.</div></div>':!a.length?'<div class="cd mu">No leads match these filters or Hide settings.</div>':view=='folders'?tree(a,['industry','state','county','city','batch']):a.slice(0,200).map(card).join('')+(a.length>200?`<div class="mu">Showing 200 of ${a.length}. Narrow the filters to see the rest.</div>`:''))}
const vLeads=()=>`${db?'':'<div class="ban">Storage is unavailable in this browser. Leads will be lost on close. Export a backup.</div>'}${tip()}<h2>Leads</h2><div class="st"><div><b>${L.length}</b><span>Total</span></div><div><b>${cnt(l=>l.phone)}</b><span>Phone</span></div><div><b>${cnt(l=>l.email)}</b><span>Email</span></div><div><b>${cnt(l=>days(l.discovered)<=7)}</b><span>New 7d</span></div></div><input id="q" type="search" placeholder="Search leads" value="${esc(q)}"><div class="fl">${sel('ind','Industry',uniq('industry'))}${sel('st','State',uniq('state'))}${sel('cl','Client',uniq('client'))}${sel('stt','Status',STAT)}${sel('cp','Campaign',uniq('campaign'))}</div>${vHide()}<div class="sg g2"><button data-v="list" class="${view=='list'?'on':''}">List</button><button data-v="folders" class="${view=='folders'?'on':''}">Folders</button><button data-a="copyall">Copy results</button><button data-a="rev">Duplicates</button></div>${out?`<div class="cd"><div class="mu">Select all, then copy:</div><textarea readonly>${esc(out)}</textarea></div>`:''}<div id="lst"></div>`;

function genMail(){const t=mailTargets();if(!t.length)return '';return `# LeadForge: look for public contact emails on business websites. Python 3, no installs.
# Follows robots.txt, pauses between requests, reads at most 3 pages per site.
import csv, html, re, sys, time, urllib.error, urllib.parse, urllib.request, urllib.robotparser
SITES=${JSON.stringify(t.map(l=>[l.id,href(l.website)]))}
UA="LeadForgeBot/0.1 (personal lead research)"; DELAY=1.5
EMAIL=re.compile(r"[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+([.][A-Za-z0-9-]+)*[.][A-Za-z]{2,}")
BAD=re.compile(r"(example|yourdomain|domain|email|sentry|wixpress|godaddy|squarespace)[.]|[.](png|jpe?g|gif|webp|svg|css|js)$",re.I)
robots={}
def allowed(url):
    p=urllib.parse.urlparse(url); o=p.scheme+"://"+p.netloc
    if o not in robots:
        rp=urllib.robotparser.RobotFileParser()
        try:
            raw=urllib.request.urlopen(urllib.request.Request(o+"/robots.txt",headers={"User-Agent":UA}),timeout=10).read(200000).decode("utf-8","ignore")
            rp.parse(raw.splitlines())
        except urllib.error.HTTPError as ex:
            rp.parse([] if ex.code in (404,410) else ["User-agent: *","Disallow: /"])
        except Exception:
            rp.parse(["User-agent: *","Disallow: /"])
        rp.modified(); robots[o]=rp
    return robots[o].can_fetch(UA,url)
def fetch(url):
    if not allowed(url): return None
    time.sleep(DELAY)
    try:
        r=urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":UA}),timeout=10)
        if "html" not in (r.headers.get("Content-Type") or ""): return None
        return r.read(400000).decode("utf-8","ignore")
    except Exception: return None
def emails(t):
    t=html.unescape(t); found=[]
    for m in re.findall(r'''mailto:([^"'?> ]+)''',t,re.I)+[m.group(0) for m in EMAIL.finditer(t)]:
        m=urllib.parse.unquote(m).strip().lower()
        if EMAIL.fullmatch(m) and not BAD.search(m) and m not in found: found.append(m)
    return found
def look(url):
    host=urllib.parse.urlparse(url).netloc.lower().replace("www.","")
    t=fetch(url); pages=[]
    for h in re.findall(r'''href=["']([^"'#]+)''',t or "",re.I):

/* ---- in-app search: runs the Overture query on a free private GitHub runner ---- */
const CLOUD_YAML="name: LeadForge search\nrun-name: \"LeadForge job ${{ inputs.job }}\"\non:\n  workflow_dispatch:\n    inputs:\n      job:\n        description: Job id\n        required: true\n      params:\n        description: Search settings (JSON)\n        required: true\npermissions:\n  contents: write\nconcurrency:\n  group: leadforge-results\n  cancel-in-progress: false\njobs:\n  search:\n    runs-on: ubuntu-latest\n    timeout-minutes: 15\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: \"3.12\"\n      - run: pip install duckdb\n      - name: Search\n        env:\n          JOB: ${{ inputs.job }}\n          PARAMS: ${{ inputs.params }}\n        run: |\n          python3 - <<'PY'\n          import csv, json, os, re, sys, traceback, urllib.parse, urllib.request\n          job = os.environ.get(\"JOB\", \"\")\n          out = {\"job\": job, \"ok\": False, \"log\": []}\n          try:\n              if not re.fullmatch(r\"[a-f0-9]{8,32}\", job): raise SystemExit(\"Bad job id\")\n              P = json.loads(os.environ[\"PARAMS\"])\n              state, sname, place = str(P[\"state\"]), str(P[\"stateName\"]), str(P[\"place\"])[:200]\n              kws = [str(k) for k in P[\"keywords\"]][:3]\n              limit, conf, rel = int(P[\"limit\"]), float(P[\"minConf\"]), str(P[\"release\"])\n              need_phone, web = bool(P[\"needPhone\"]), str(P[\"web\"])\n              if not re.fullmatch(r\"[A-Z]{2}\", state) or not re.fullmatch(r\"[A-Za-z .]{2,40}\", sname): raise SystemExit(\"Bad state\")\n              if not kws or not all(re.fullmatch(r\"[a-z0-9_]{2,60}\", k) for k in kws): raise SystemExit(\"Bad keyword\")\n              if not re.fullmatch(r\"[0-9][0-9.-]*\", rel): raise SystemExit(\"Bad release\")\n              if not (1 <= limit <= 5000 and 0 <= conf <= 1 and web in (\"any\", \"none\", \"nosite\")): raise SystemExit(\"Bad settings\")\n              import duckdb\n              req = urllib.request.Request(\"https://nominatim.openstreetmap.org/search?\" + urllib.parse.urlencode({\"q\": place, \"format\": \"json\", \"limit\": 1}), headers={\"User-Agent\": \"LeadForge-personal/0.1\"})\n              hit = json.load(urllib.request.urlopen(req, timeout=30))\n              if not hit: raise SystemExit(\"Place not found: \" + place)\n              dn = hit[0].get(\"display_name\", \"\")\n              if sname.lower() not in dn.lower(): raise SystemExit(\"Stopped: place resolved outside \" + sname + \": \" + dn)\n              out[\"resolved\"] = dn\n              s, n, w, e = map(float, hit[0][\"boundingbox\"])\n              SRC = f\"s3://overturemaps-us-west-2/release/{rel}/theme=places/type=place/*\"\n              con = duckdb.connect(); con.execute(\"INSTALL httpfs; LOAD httpfs; SET s3_region='us-west-2';\")\n              cols = {r[0] for r in con.execute(f\"DESCRIBE SELECT * FROM read_parquet('{SRC}', hive_partitioning=1)\").fetchall()}\n              have = lambda c, expr: expr if c in cols else \"NULL\"\n              if \"taxonomy\" in cols:\n                  cat = \"taxonomy.primary\"\n                  catcond = lambda k: f\"(CAST(taxonomy.hierarchy AS VARCHAR) ILIKE '%{k}%' OR CAST(taxonomy.alternates AS VARCHAR) ILIKE '%{k}%')\"\n              elif \"categories\" in cols:\n                  cat = \"categories.primary\"; catcond = lambda k: f\"categories.primary ILIKE '%{k}%'\"\n              else:\n                  raise SystemExit(\"No category column found. Columns: \" + str(sorted(cols)))\n              sel = f\"SELECT names.primary AS name, {have('phones','phones[1]')} AS phone, {have('emails','emails[1]')} AS email, {have('websites','websites[1]')} AS website, addresses[1].freeform AS address, addresses[1].locality AS city, addresses[1].region AS state, addresses[1].postcode AS zip, {cat} AS category, confidence\"\n              frm = f\"FROM read_parquet('{SRC}', hive_partitioning=1)\"\n              DIRS = \"facebook|instagram|yelp|linkedin|youtube|youtu|linktr|homeadvisor|angi|angieslist|houzz|thumbtack|yellowpages|bbb|mapquest|manta|nextdoor|twitter|tiktok|pinterest|weblinkconnect\"\n              def conds_for(k):\n                  c = [(\"in area (bbox)\", f\"bbox.xmin BETWEEN {w} AND {e} AND bbox.ymin BETWEEN {s} AND {n}\"), (\"in state\", f\"addresses[1].region IN ('{state}','US-{state}')\"), (\"matches keyword\", catcond(k)), (\"confidence ok\", f\"confidence>={conf}\")]\n                  if \"operating_status\" in cols: c.append((\"not closed\", \"COALESCE(operating_status,'open')<>'permanently_closed'\"))\n                  if need_phone and \"phones\" in cols: c.append((\"has phone\", \"phones[1] IS NOT NULL\"))\n                  if web != \"any\" and \"websites\" not in cols: out[\"log\"].append(\"No websites column in this release; website filter skipped.\")\n                  elif web == \"none\": c.append((\"no website listed\", \"websites[1] IS NULL\"))\n                  elif web == \"nosite\": c.append((\"no real website\", f\"(websites[1] IS NULL OR regexp_matches(lower(regexp_extract(websites[1],'^(https?://)?([^/?#]+)',2)),'(^|[.])({DIRS})[.]'))\"))\n                  return c\n              total, used, conds = 0, \"\", []\n              for kw in kws:\n                  conds = conds_for(kw)\n                  q = f\"COPY ({sel} {frm} WHERE \" + \" AND \".join(c for _, c in conds) + f\" ORDER BY confidence DESC LIMIT {limit}) TO 'leads.csv' (HEADER, DELIMITER ',')\"\n                  con.execute(q)\n                  total = sum(1 for _ in csv.reader(open(\"leads.csv\", newline=\"\"))) - 1\n                  out[\"log\"].append(f\"keyword {kw}: {total} rows\")\n                  used = kw\n                  if total > 0: break\n              out[\"ok\"], out[\"count\"], out[\"keyword\"] = True, total, used\n              if total > 0:\n                  out[\"csv\"] = open(\"leads.csv\", encoding=\"utf-8\").read()\n              else:\n                  out[\"funnel\"] = []\n                  for i in range(len(conds)):\n                      k = con.execute(f\"SELECT count(*) {frm} WHERE \" + \" AND \".join(c for _, c in conds[:i + 1])).fetchone()[0]\n                      out[\"funnel\"].append(f\"{conds[i][0]}: {k}\")\n                  out[\"categories\"] = [f\"{r[0]} ({r[1]})\" for r in con.execute(f\"SELECT {cat}, count(*) {frm} WHERE {conds[0][1]} AND {conds[1][1]} GROUP BY 1 ORDER BY 2 DESC LIMIT 15\").fetchall()]\n          except SystemExit as stop:\n              out[\"error\"] = str(stop)\n          except Exception as ex:\n              out[\"error\"] = type(ex).__name__ + \": \" + str(ex)[:300]\n              out[\"log\"].append(traceback.format_exc()[-1200:])\n          os.makedirs(\"results\", exist_ok=True)\n          with open(\"results/\" + (job if re.fullmatch(r\"[a-f0-9]{8,32}\", job) else \"bad\") + \".json\", \"w\") as fh: json.dump(out, fh)\n          PY\n      - name: Save result\n        env:\n          JOB: ${{ inputs.job }}\n        run: |\n          git config user.name \"leadforge-bot\"\n          git config user.email \"leadforge-bot@users.noreply.github.com\"\n          ls -1t results | tail -n +31 | xargs -r -I{} git rm -q --ignore-unmatch \"results/{}\" || true\n          git add results\n          git commit -m \"result $JOB\" || exit 0\n          git pull --rebase origin \"$GITHUB_REF_NAME\" || true\n          git push origin \"HEAD:$GITHUB_REF_NAME\"\n";
let clPoll=6000,CL_MAX=600000,clBusy=false,clStop=false,clLog='',clMsg='';
const cl=()=>{try{return JSON.parse(localStorage.getItem('lf_cloud')||'{}')||{}}catch(e){return{}}};
const clSave=o=>{try{localStorage.setItem('lf_cloud',JSON.stringify(o))}catch(e){}};
const clOK=()=>{const c=cl();return !!(c.repo&&c.token&&c.ok)};
const normY=s=>String(s).replace(/\r\n/g,'\n').split('\n').map(l=>l.replace(/\s+$/,'')).join('\n').trim();
const REPO_RE=/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/;
let GH_API='https://api.github.com';
function ghx(path,opt){const c=cl(),get=!(opt&&opt.method);return fetch(GH_API+path+(get?(path.includes('?')?'&':'?')+'_='+Date.now():''),Object.assign({},opt||{},{headers:Object.assign({Accept:'application/vnd.github+json',Authorization:'Bearer '+c.token},(opt&&opt.headers)||{})}))}
function clStatus(m){clMsg=m;const e=$('#cs');if(e)e.textContent=m}
async function clTest(){const c=cl();if(!REPO_RE.test(c.repo||'')||!c.token)return clStatus('Enter the repository (owner/name) and the token first.');clSave(Object.assign({},c,{ok:false}));clStatus('Checking...');
 try{const r=await ghx('/repos/'+c.repo);if(r.status==401)return clStatus('GitHub rejected the token. Make a new one and try again.');if(r.status==404)return clStatus('Repository not found, or the token cannot see it. Check the name, and that the token includes this repository.');if(!r.ok)return clStatus('GitHub said '+r.status+'.');
  const j=await r.json();if(!j.private)return clStatus('Stopped: that repository is PUBLIC, so your search results would be public. Use a private repository.');
  const w=await ghx('/repos/'+c.repo+'/actions/workflows/search.yml');if(w.status==404)return clStatus('Connected, but search.yml was not found in .github/workflows. Add the workflow file first.');if(!w.ok)return clStatus('Could not read the workflow (status '+w.status+'). The token needs Actions permission.');
  const f=await ghx('/repos/'+c.repo+'/contents/.github/workflows/search.yml?ref='+encodeURIComponent(j.default_branch||'main'),{headers:{Accept:'application/vnd.github.raw+json'}});
  if(f.ok){const A=normY(await f.text()).split('\n'),B=normY(CLOUD_YAML).split('\n');let i=0;while(i<B.length&&A[i]===B[i])i++;if(i<B.length||A.length>B.length)return clStatus('The workflow file in your repository does not match. First difference is on line '+(i+1)+'. You have: "'+String(A[i]===undefined?'(end of file)':A[i]).slice(0,50)+'". Expected: "'+String(B[i]===undefined?'(end of file)':B[i]).slice(0,50)+'". Open the file, delete everything, tap Copy workflow file, and paste it again.')}
  clSave(Object.assign({},cl(),{ok:true,branch:j.default_branch||'main'}));clStatus('Connected. In-app search is ready.');render()}catch(e){clStatus('Could not reach GitHub. Check your connection.')}}
function cloudSpec(){const kw=kwOf(),stc=stCode(ctx.state),m=ST.find(s=>s[0]==stc);if(!m)return{err:'Choose a state first.'};if(!kw||kw.length<2)return{err:'Enter an industry, niche or keyword first.'};const rel=/^[0-9][0-9.\-]*$/.test(sk.rel)?sk.rel:'';if(!rel)return{err:'The Overture release looks wrong.'};
 const kws=sk.kw?[kw]:[...new Set([kw,kw.split('_').pop()])].filter(x=>x.length>=3);
 return{p:{place:[ctx.city,ctx.county,m[1],'USA'].map(clean).filter(Boolean).join(', '),state:stc,stateName:m[1],keywords:kws,limit:Math.max(1,Math.min(5000,+sk.n||100)),minConf:Math.min(1,Math.max(0,+sk.conf||.5)),release:rel,needPhone:!!sk.ph,web:sk.web=='None listed'?'none':(sk.web||'').startsWith('None, or')?'nosite':'any'}}}
async function clDone(res){clLog=(res.funnel&&res.funnel.length?'Businesses left after each filter:\n'+res.funnel.join('\n')+'\n\nMost common categories here:\n'+(res.categories||[]).join('\n')+'\n\n':'')+(res.log||[]).join('\n');
 if(!res.ok){clStatus('The search stopped: '+(res.error||'unknown error'));render();return}
 if(!res.count){clStatus('0 businesses matched'+(res.resolved?' in '+res.resolved:'')+'. See the breakdown below, and try a category from the list.');render();return}
 try{localStorage.removeItem('lf_cloud_job')}catch(e){}
 clStatus('Found '+res.count+(res.resolved?' in '+res.resolved:'')+' (keyword '+res.keyword+'). Review below.');ingest(res.csv,'In-app search');if(tab!='src')toast('Search finished: '+res.count+' found. Open Find to review.')}
async function cloudSearch(){if(clBusy)return;const c=cl();if(!clOK())return clStatus('Set up in-app search first (see the setup box).');const sp=cloudSpec();if(sp.err)return clStatus(sp.err);
 const job=Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>b.toString(16).padStart(2,'0')).join('');clBusy=true;clStop=false;clLog='';pend=null;
 try{clStatus('Starting the search...');
  const r=await ghx('/repos/'+c.repo+'/actions/workflows/search.yml/dispatches',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ref:c.branch||'main',inputs:{job:job,params:JSON.stringify(sp.p)}})});
  if(r.status!=204){let m='';try{m=(await r.json()).message||''}catch(e){}clStatus(r.status==401?'GitHub rejected the token.':r.status==403?'The token is missing Actions permission (it needs Read and write).':r.status==404?'Workflow or repository not found.':r.status==422?'GitHub could not start the workflow'+(m?' ("'+m+'")':'')+'. The workflow file may have an error. Tap Save and test in the setup box to find it.':'GitHub said '+r.status+'.');return}
  try{localStorage.setItem('lf_cloud_job',job)}catch(e){}
  const t0=Date.now();let n=0,st='';
  while(Date.now()-t0<CL_MAX&&!clStop){await new Promise(z=>setTimeout(z,clPoll));if(clStop)break;n++;
   const g=await ghx('/repos/'+c.repo+'/contents/results/'+job+'.json?ref='+encodeURIComponent(c.branch||'main'),{headers:{Accept:'application/vnd.github.raw+json'}});
   if(g.ok){await clDone(JSON.parse(await g.text()));return}
   if(g.status!=404){clStatus('GitHub said '+g.status+' while waiting.');return}
   if(n%2==0){try{const q=await ghx('/repos/'+c.repo+'/actions/runs?event=workflow_dispatch&per_page=10');if(q.ok){const j=await q.json(),run=(j.workflow_runs||[]).find(x=>(x.display_title||x.name||'').includes(job));if(run){st=run.status;if(run.status=='completed'&&run.conclusion&&run.conclusion!='success'){clStatus('The search failed on GitHub ('+run.conclusion+'). Open the Actions tab in your repository to see why.');return}}}}catch(e){}}
   clStatus('Searching... '+Math.round((Date.now()-t0)/1000)+'s '+(st?'('+st.replace('_',' ')+')':'(starting)'))}
  clStatus(clStop?'Cancelled. The search may still finish on GitHub. Use "Check for a finished search" later.':'Still running after '+Math.round(CL_MAX/60000)+' minutes. Try "Check for a finished search" in a minute.')
 }catch(e){clStatus('Could not reach GitHub. Check your connection.')}finally{clBusy=false}}
async function clCheck(){let job='';try{job=localStorage.getItem('lf_cloud_job')||''}catch(e){}const c=cl();if(!job||!clOK())return clStatus('No unfinished search found.');
 try{const g=await ghx('/repos/'+c.repo+'/contents/results/'+job+'.json?ref='+encodeURIComponent(c.branch||'main'),{headers:{Accept:'application/vnd.github.raw+json'}});if(g.ok)return clDone(JSON.parse(await g.text()));clStatus(g.status==404?'Not finished yet. Try again in a minute.':'GitHub said '+g.status+'.')}catch(e){clStatus('Could not reach GitHub.')}}
function vCloudGo(){const ok=clOK();return `<div class="cd"><b>Search in the app</b><div class="mu">${ok?'Runs the search on your private GitHub runner. Takes about 1 to 3 minutes.':'One-time setup needed. See the setup box above.'}</div><button class="p" data-a="clgo" style="width:100%;margin-top:8px"${ok?'':' disabled'}>Search in app</button><div class="sg" style="margin-top:8px"><button data-a="clstop">Cancel</button><button data-a="clchk">Check for a finished search</button></div><div id="cs" class="mu" style="min-height:1.4em">${esc(clMsg)}</div>${clLog?'<textarea readonly style="min-height:130px;font:12px/1.3 ui-monospace,monospace">'+esc(clLog)+'</textarea>':''}${pend&&pend.name=='In-app search'?vPrev():''}</div>`}
function vCloudSetup(){const c=cl(),ok=clOK();return `<details class="hb"${ok?'':' open'}><summary>${ok?'In-app search: connected':'Set up in-app search (one time, about 10 minutes)'}</summary><div class="mu"><b>1.</b> In Safari open github.com/new. Name it something unguessable. Choose <b>Private</b>, tick Add a README, Create.<br><b>2.</b> In that repository: Add file, Create new file. Name it <b>.github/workflows/search.yml</b> (type the slashes), paste the workflow below, Commit.<br><b>3.</b> Open github.com/settings/personal-access-tokens/new. Name it LeadForge, pick an expiry, choose Only select repositories and pick your new repository. Under Repository permissions set <b>Actions</b> to Read and write and <b>Contents</b> to Read-only. Generate and copy the token.<br><b>4.</b> Fill in the two boxes below and tap Save and test.<br>The token stays on this phone and is only sent to GitHub. If it is ever lost, delete it in GitHub settings.</div><textarea id="cy" readonly style="min-height:110px;margin-top:8px;font:11px/1.3 ui-monospace,monospace">${esc(CLOUD_YAML)}</textarea><button data-a="clyaml" style="width:100%;margin:8px 0">Copy workflow file</button><label>Repository (owner/name)<input data-cl="repo" value="${esc(c.repo||'')}" placeholder="yourname/your-private-repo" autocapitalize="off" autocorrect="off"></label><label>Token<input type="password" data-cl="token" value="${esc(c.token||'')}" autocomplete="off"></label><div class="sg"><button class="p" data-a="cltest">Save and test</button><button data-a="clrm">Remove</button></div></details>`}

document.addEventListener('click',async e=>{const b=e.target.closest('[data-t],[data-v],[data-a],[data-id]');if(!b)return;const d=b.dataset;if(d.t){tab=d.t;out='';render()}else if(d.v){view=d.v;render()}else if(d.id)open(d.id);else if(d.a=='copy')copySc();else if(d.a=='prev'){paste.trim()?ingest(paste,'Pasted results'):toast('Paste the results first')}else if(d.a=='copyall')copyAll();else if(d.a=='clearh'){hd={};hcat=new Set();hwords='';saveHide();saveH2();render()}else if(d.a=='lock')await lockNow();else if(d.a=='cltest')await clTest();else if(d.a=='clgo')await cloudSearch();else if(d.a=='clstop'){clStop=true}else if(d.a=='clchk')await clCheck();else if(d.a=='clyaml')copyTxt(CLOUD_YAML,'#cy');else if(d.a=='clrm'){clSave({});clMsg='';render()}else if(d.a=='rev')revOpen();else if(['mA','mB','sep','skip'].includes(d.a))await revDo(d.a);else if(d.a=='ocl'){f={ind:'',st:'',cl:d.cl,stt:'',cp:d.cp||''};q='';tab='leads';render()}else if(d.a=='xcl'){f={ind:'',st:'',cl:d.cl,stt:'',cp:''};q='';tab='exp';render()}else if(d.a=='assign')await assign();else if(d.a=='copym')copyTxt(genMail(),'#ms');else if(d.a=='copyg')copyTxt(genGeo(),'#gs');else if(d.a=='prevm'){const r=parseMail(epaste);if(!r)toast('No id,email,page table found. Nothing changed.');else if(!r.up.length)toast('No new emails in that result.');else{epend=r;render()}}else if(d.a=='applym')await applyMail();else if(d.a=='cancelm'){epend=null;render()}else if(d.a=='saveg')saveGeo(gpaste);else if(d.a=='savesc')saveAs('leadforge-overture-query.txt',genScript());else if(d.a=='commit')await commit();else if(d.a=='cancel'){pend=null;render()}else if(d.a=='csv'||d.a=='json'||d.a=='xlsx')await exportFile(d.a);else if(d.a=='pdeliv'){xcs=DELIV.slice();saveCols();render()}else if(d.a=='pall'){xcs=COLS.slice();saveCols();render()}else if(d.a=='sum')copyTxt(summary(expRows()).join(String.fromCharCode(10)),'#sm');else if(d.a=='addsup')await addSup(spaste);else if(d.a=='rmsup'){const i=d.sv.indexOf(':'),ty=d.sv.slice(0,i),v=d.sv.slice(i+1);SUP=SUP.filter(s=>!(s.t==ty&&s.v==v));saveSup();supOpen=true;render()}else if(d.a=='supthis')await supThis();else if(d.a=='close')$('#md').hidden=true;else if(d.a=='save'&&cur){cur.status=$('#ds').value;cur.notes=$('#dn').value.slice(0,2000);try{await put([cur]);$('#md').hidden=true;render();toast('Saved')}catch(x){toast('Save failed')}}else if(d.a=='del'&&cur){if(!delArm){delArm=true;b.textContent='Tap again to delete for good';return}try{await rm(cur.id);L=await all();$('#md').hidden=true;render();toast('Deleted')}catch(x){toast('Delete failed')}}});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;if(d.c){ctx[d.c]=t.value;if(d.c=='state')render();else{upd();const gn=$('#gn');if(gn)gn.textContent=geoNote()}}else if(d.k){sk[d.k]=t.type=='checkbox'?t.checked:t.value;upd()}else if(d.f){f[d.f]=t.value;drawList()}else if(d.h!==undefined){hd[d.h]=t.checked;saveHide();const n=$('#hn');if(n)n.textContent=hTxt();drawList()}else if(d.hc!==undefined){t.checked?hcat.add(d.hc):hcat.delete(d.hc);saveH2();const n=$('#hn');if(n)n.textContent=hTxt();drawList()}else if(d.hw!==undefined){hwords=t.value;saveH2();const n=$('#hn');if(n)n.textContent=hTxt();drawList()}else if(d.xc!==undefined){xcs=t.checked?[...new Set([...xcols(),d.xc])]:xcols().filter(c=>c!=d.xc);saveCols();drawPv()}else if(d.cb!==undefined){ctx[d.cb]=t.checked}else if(d.cl!==undefined){const c=cl();c[d.cl]=t.value.trim();c.ok=false;clSave(c)}else if(d.x){xo[d.x]=t.checked;if(tab=='exp')render()}else if(t.id=='q'){q=t.value;drawList()}else if(t.id=='pt')paste=t.value;else if(t.id=='sp')spaste=t.value;else if(t.id=='et')epaste=t.value;else if(t.id=='gt')gpaste=t.value;else if(d.s){asg[d.s]=t.value;asArm=false;const b=$('#asb');if(b)b.textContent='Assign'}});
document.addEventListener('toggle',e=>{if(e.target.id=='hd')hOpen=e.target.open},true);
document.addEventListener('change',e=>{if(e.target.id=='fi')pick(e.target.files[0])});
(async()=>{await openDB();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}L=await all();render();try{navigator.storage&&navigator.storage.persisted&&navigator.storage.persisted().then(v=>{pers=v;if(tab=='exp')render()})}catch(e){}try{if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)&&!window.claude)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}})();
